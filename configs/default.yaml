# Default configuration. Override with configs/local.yaml (gitignored) or
# env vars for machine-specific paths.

paths:
  raw_videos: data/raw/videos
  raw_keyframes: data/raw/keyframes
  clip_features: data/features/clip
  map_keyframes: data/metadata/map_keyframes
  media_info: data/metadata/media_info
  objects: data/metadata/objects
  index_dir: data/index
  queries_dir: data/queries
  submission_dir: data/submission

competition:
  max_candidates_per_query: 100
  r_at_k: [1, 5, 20, 50, 100]
  answer_max_chars: 100
  # Filename patterns the query parser uses to infer task type.
  task_suffix_map:
    kis: "kis"
    qa: "qa"
    trake: "trake"

models:
  # Provided by organizer: clip-features-32-aic25-b1 => CLIP ViT-B/32, dim 512.
  # The TEXT encoder below must be the matching tower of the same model so
  # that text/image embeddings live in the same space.
  clip_text:
    name: "openai/clip-vit-base-patch32"
    device: "cuda"        # falls back to cpu automatically if unavailable
  vqa:
    name: "Qwen/Qwen2-VL-7B-Instruct"
    fallback_name: "Qwen/Qwen2-VL-2B-Instruct"   # used automatically on OOM
    device: "cuda"
    dtype: "float16"
    max_new_tokens: 32    # answers are short (<=100 chars); never let it ramble

retrieval:
  alpha: 0.7              # visual (CLIP) weight; 1-alpha goes to BM25
  top_k_clip: 200         # FAISS candidates fetched per query before fusion
  top_k_for_vqa: 20       # KIS candidates passed to the VLM for answering
  trake:
    per_event_clip_k: 50  # keyframe candidates per event for video voting
    per_event_frames: 3   # frames per event used to build candidate rows
  rerank:
    # VLM (Qwen) rerank stages, used by every task unless --no-vlm is set.
    kis_top_k: 40         # KIS frames visually verified per query (head of the list)
    trake_videos: 5       # voted videos whose per-event frames get verified
