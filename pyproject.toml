[project]
name = "aic-system"
version = "0.1.0"
description = "KIS / Q&A / TRAKE retrieval system for the AIC-style video retrieval competition"
requires-python = ">=3.10,<3.12"

# NOTE on dependency strategy (single venv, avoid CUDA-runtime conflicts):
#   - torch is pinned to a cu121 build; everything below is chosen to be
#     compatible with that single CUDA runtime rather than bringing its own
#     (faiss-cpu instead of faiss-gpu; no easyocr/paddle — OCR+ASR deferred).
#   - ASR (faster-whisper), OCR (easyocr) and scenedetect are intentionally
#     NOT dependencies: the pipeline runs on pre-extracted keyframes +
#     pre-computed CLIP features only. Re-add only if a later submission
#     round justifies the extra install risk.
#   - Install torch FIRST from the official index, then the rest:
#       pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
#       pip install -e ".[dev]"
#   - Or just run scripts/setup_venv.sh, which does both steps in order.
dependencies = [
    "transformers>=4.46,<5.0",   # >=4.45 needed for Qwen2-VL support
    "accelerate>=0.34",
    "sentencepiece",
    "faiss-cpu>=1.8",
    "opencv-python-headless>=4.10",
    "rank_bm25>=0.2.2",          # pure-python BM25 over media_info titles/keywords
    "numpy<2.0",                 # faiss-cpu wheels on some platforms lag behind numpy 2.x
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pip-tools>=7.4",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
